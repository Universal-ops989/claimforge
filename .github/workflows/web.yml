name: Web

# Everything except the API, but including its OpenAPI contract: the typed client is
# generated from it, and its tests fail when the two drift apart.
on:
  pull_request:
    paths:
      - "**"
      - "!apps/api/**"
      - "!.github/workflows/api.yml"
      - "apps/api/openapi.json"
  push:
    branches: [main]
    paths:
      - "**"
      - "!apps/api/**"
      - "!.github/workflows/api.yml"
      - "apps/api/openapi.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Lint, typecheck, test, build (incl. Storybook)
        run: pnpm turbo run lint typecheck test build build-storybook --cache-dir=.turbo

  storybook-tests:
    name: Storybook browser tests (interactions + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @claimforge/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @claimforge/ui exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @claimforge/ui exec playwright install-deps chromium
      - name: Run stories as tests
        run: pnpm turbo run test-storybook
