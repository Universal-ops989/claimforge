# Alembic configuration. The database URL comes from CLAIMFORGE_DATABASE_URL (see
# claimforge_api.core.settings); tests override it with `sqlalchemy.url`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Sortable file names: 20261113_1a2b3c4d5e6f_create_users.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
