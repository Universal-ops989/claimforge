[project]
name = "claimforge-api"
version = "0.1.0"
description = "ClaimForge HTTP API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimforge_api"]

[tool.pip-tools]
generate-hashes = false
strip-extras = true
